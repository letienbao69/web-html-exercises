<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>📝 Todo App</h1>
      <nav>
        <a href="#" class="filter active" data-filter="all">All</a>
        <a href="#" class="filter" data-filter="active">Active</a>
        <a href="#" class="filter" data-filter="completed">Completed</a>
      </nav>
    </header>

    <main>
      <form id="todoForm">
        <input id="todoInput" type="text" placeholder="Bạn cần làm gì?" autocomplete="off">
        <button type="submit">Thêm</button>
      </form>

      <ul id="todoList"></ul>

      <footer class="bar">
        <span id="count">0 việc chưa xong</span>
        <button id="clearCompleted">Xóa việc đã xong</button>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
