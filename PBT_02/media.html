<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Multimedia giới thiệu sản phẩm</title>
</head>
<body>
    <header>
        <h1>TechStore Multimedia</h1>
        <p>Giới thiệu sản phẩm với hình ảnh, video, audio và SVG</p>

        <svg width="120" height="80" viewBox="0 0 120 80" role="img" aria-label="Logo TechStore hình tròn và chữ T">
            <circle cx="40" cy="40" r="30" fill="#0d6efd"></circle>
            <rect x="70" y="20" width="35" height="40" fill="#198754"></rect>
            <text x="34" y="48" font-size="24" fill="white">T</text>
        </svg>

        <nav>
            <ul>
                <li><a href="#gallery">Ảnh sản phẩm</a></li>
                <li><a href="#youtube">Video YouTube</a></li>
                <li><a href="#video">Video HTML5</a></li>
                <li><a href="#audio">Audio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="gallery">
            <h2>Thư viện ảnh sản phẩm</h2>

            <figure>
                <img src="https://placehold.co/600x400" alt="Ảnh mặt trước điện thoại thông minh màu đen" loading="lazy" style="max-width: 100%; height: auto;">
                <figcaption>Mặt trước sản phẩm với màn hình lớn</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400" alt="Ảnh mặt sau điện thoại với cụm camera" loading="lazy" style="max-width: 100%; height: auto;">
                <figcaption>Mặt sau sản phẩm với cụm camera nổi bật</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/600x400" alt="Ảnh hộp sản phẩm và phụ kiện đi kèm" loading="lazy" style="max-width: 100%; height: auto;">
                <figcaption>Hộp sản phẩm và phụ kiện đi kèm</figcaption>
            </figure>
        </section>

        <section id="youtube">
            <h2>Video giới thiệu từ YouTube</h2>

            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video giới thiệu sản phẩm trên YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </section>

        <section id="video">
            <h2>Video HTML5</h2>

            <video controls poster="https://placehold.co/800x450" width="640">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
        </section>

        <section id="audio">
            <h2>Audio giới thiệu</h2>

            <audio controls>
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ thẻ audio.
            </audio>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TechStore Multimedia</p>
    </footer>
</body>
</html>
