<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transitions & Animations</title>
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <h1>5 hiệu ứng CSS</h1>

  <!-- 1 + 3: Card hover (translateY + shadow) & Image zoom -->
  <section>
    <h2>1 & 3 — Card hover + Image zoom</h2>
    <div class="card">
      <div class="img-wrap">
        <img src="https://picsum.photos/seed/anim/400/250" alt="Sản phẩm">
      </div>
      <h3>Laptop Pro 14"</h3>
      <!-- 2: Button hover -->
      <button class="buy-btn">Mua ngay</button>
    </div>
  </section>

  <!-- 4: Loading spinner -->
  <section>
    <h2>4 — Loading spinner</h2>
    <div class="spinner"></div>
  </section>

  <!-- 5: Fade-in -->
  <section>
    <h2>5 — Fade-in (chạy khi tải trang)</h2>
    <div class="fade-box">Khối này hiện dần lên từ dưới.</div>
  </section>
</body>
</html>
