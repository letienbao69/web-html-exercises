<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo — Vanilla JS</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .todo-item.done span { text-decoration: line-through; color: #999; }
        .todo-item button { margin-left: auto; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        input[type="text"] { padding: 8px; width: 70%; }
        button.add-btn { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📋 Todo List (Vanilla JS)</h1>
    <div>
        <input type="text" id="todoInput" placeholder="Nhập công việc...">
        <button class="add-btn" onclick="addTodo()">Thêm</button>
    </div>
    <div id="todoList"></div>

    <script>
        let todos = [];

        // Render toàn bộ danh sách ra DOM
        function renderTodos() {
            const list = document.getElementById('todoList');        // TODO 1
            list.innerHTML = '';                                     // TODO 2
            list.innerHTML = todos.map(todo => `                     
                <div class="todo-item ${todo.done ? 'done' : ''}">
                    <input type="checkbox" ${todo.done ? 'checked' : ''}
                           onchange="toggleTodo(${todo.id})">
                    <span>${todo.text}</span>
                    <button onclick="deleteTodo(${todo.id})">Xóa</button>
                </div>
            `).join('');                                             // TODO 3 + 4
        }

        // Thêm todo mới
        function addTodo() {
            const input = document.getElementById('todoInput');      // TODO 5
            const text = input.value.trim();
            if (!text) return;
            const todo = { id: Date.now(), text: text, done: false };// TODO 6
            todos.push(todo);                                        // TODO 7
            renderTodos();                                           // TODO 8
            input.value = '';                                        // TODO 9
        }

        // Toggle done
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);               // TODO 10
            if (todo) todo.done = !todo.done;
            renderTodos();                                           // TODO 11
        }

        // Xóa todo
        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);                  // TODO 12
            renderTodos();                                           // TODO 13
        }
    </script>
</body>
</html>
